<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p
        {
            color: black;
        }
        img
        {
            width: 100vw;
            height: 100vh;
        }
        p.top
        {
            position: fixed;
            top: 0%;
        }
        p.mid
        {
            position: fixed;
            top: 50%;
        }
        p.bottom
        {
            position: fixed;
            bottom: 0;
        }
        *{
            margin: 0;
            padding: 0;
        }
        #centre{
            text-align: center;        }
        #right{
            text-align: right;
        }
        p
        {
            width: 100%;
        }
    </style>
</head>
<body>
    <img src="TAUSIF PHOTO 1.jpeg" alt="My Photo">
    <p class="top" id="centre">Tausif Raza</p>
    <p class="top">Tausif Raza</p>
    <p class="top" id="right">Tausif Raza</p>
    <p class="mid" id="centre">Tausif Raza</p>
    <p class="mid">Tausif Raza</p>
    <p class="mid" id="right">Tausif Raza</p>
    <p class="bottom" id="centre">Tausif Raza </p>
    <p class="bottom">Tausif Raza </p>
    <p class="bottom" id="right">Tausif Raza  </p>
</body>
</html>
